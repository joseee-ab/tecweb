<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>ProductApp</title>
    <!-- BOOTSTRAP 4  -->
    <link rel="stylesheet" href="https://bootswatch.com/4/superhero/bootstrap.min.css">
  </head>
  <body>

    <!-- BARRA DE NAVEGACIÓN  -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href=".">ProductApp</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ml-auto"></ul>
          <form class="form-inline my-2 my-lg-0">
            <input class="form-control mr-sm-2" name="search" id="search" type="search" placeholder="ID, marca o descripción" aria-label="Search">
            <button class="btn btn-success my-2 my-sm-0" type="submit">Buscar</button>
          </form>
      </div>
    </nav>

    <div class="container">
      <div class="row p-4">
        <div class="col-md-5">
          <div class="card">
            <div class="card-body">
              <!-- FORMULARIO PARA AGREGAR PRODUCTO -->
              <form id="product-form">
                <div id="entradas">
                  <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input class="form-control" type="text" id="nombre" name="nombre" placeholder="Nombre del producto">
                    <div class="error text-danger small"></div>
                  </div>

                  <div class="form-group">
                    <label>Marca:</label>
                    <input class="form-control" type="text" name="marca" placeholder="Marca del producto">
                    <div class="error text-danger small"></div>
                  </div>

                  <div class="form-group">
                    <label>Modelo:</label>
                    <input class="form-control" type="text" name="modelo" placeholder="Modelo del producto">
                    <div class="error text-danger small"></div>
                  </div>

                  <div class="form-group">
                    <label>Precio:</label>
                    <input class="form-control" type="number" step="0.01" name="precio" placeholder="Precio del producto">
                    <div class="error text-danger small"></div>
                  </div>

                  <div class="form-group">
                    <label>Detalles:</label>
                    <textarea class="form-control" name="detalles" rows="3" placeholder="Detalles del producto"></textarea>
                    <div class="error text-danger small"></div>
                  </div>

                  <div class="form-group">
                    <label>Unidades:</label>
                    <input class="form-control" type="number" name="unidades" placeholder="Cantidad en inventario">
                    <div class="error text-danger small"></div>
                  </div>

                  <div class="form-group">
                    <label>Imagen (opcional):</label>
                    <input class="form-control" type="text" name="imagen" placeholder="URL o ruta de imagen">
                    <div class="error text-danger small"></div>
                  </div>
                </div>

                <input type="hidden" id="productId" name="id">
                <button class="btn btn-primary btn-block" type="submit">Agregar Producto</button>
              </form>
            </div>
          </div>
        </div>

        <!-- TABLA  -->
        <div class="col-md-7">
          <div class="card my-4" id="product-result">
            <div class="card-body">
              <!-- RESULTADO -->
              <ul id="container"></ul>
            </div>
          </div>

          <table class="table table-bordered table-sm">
            <thead>
              <tr>
                <td>Id</td>
                <td>Nombre</td>
                <td>Descripción</td>
              </tr>
            </thead>
            <tbody id="products"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.min.js"
      integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
      crossorigin="anonymous"></script>
    <!-- Lógica del Frontend -->
    <script src="validaciones.js"></script>
    <script src="app.js"></script>
  </body>
</html>
